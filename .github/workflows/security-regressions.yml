name: Security regressions
on:
  pull_request:
permissions:
  contents: read
jobs:
  regressions:
    if: github.head_ref == 'gpt/nocturne-final'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Focused security behaviour (no signing or secrets)
        run: |
          set -o pipefail
          ./gradlew --no-daemon --continue --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8' \
            :core:test --tests '*SecurityTest' :app:testDebugUnitTest --tests '*SecurityTest' 2>&1 | tee security-regressions.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: security-regressions-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            security-regressions.log
            core/build/test-results/test/
            app/build/test-results/testDebugUnitTest/
          retention-days: 14
      # Public binaries only; this job receives no credentials or signing material.
      - name: Package public offline build inputs
        if: always() && github.run_number == 3
        run: |
          mkdir -p "$RUNNER_TEMP/public-inputs" "$RUNNER_TEMP/public-parts"
          tar -czf "$RUNNER_TEMP/public-inputs/gradle-public.tar.gz" -C "$HOME" \
            .gradle/caches/modules-2 .gradle/wrapper/dists
          if [ -d "$HOME/.m2/repository/org/robolectric" ]; then
            tar -czf "$RUNNER_TEMP/public-inputs/robolectric-public.tar.gz" -C "$HOME" .m2/repository/org/robolectric
          fi
          tar -czf "$RUNNER_TEMP/public-inputs/android-sdk-public.tar.gz" -C "$ANDROID_HOME" \
            platforms/android-36 build-tools/35.0.0 licenses
          tar -czf "$RUNNER_TEMP/public-inputs/jdk17-public.tar.gz" -C "$JAVA_HOME" .
          tar -cf - -C "$RUNNER_TEMP/public-inputs" . | split -b 400m -d - "$RUNNER_TEMP/public-parts/input-"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && github.run_number == 3
        with:
          name: public-inputs-00-${{ github.run_id }}
          path: ${{ runner.temp }}/public-parts/input-00
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && github.run_number == 3
        with:
          name: public-inputs-01-${{ github.run_id }}
          path: ${{ runner.temp }}/public-parts/input-01
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && github.run_number == 3
        with:
          name: public-inputs-02-${{ github.run_id }}
          path: ${{ runner.temp }}/public-parts/input-02
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && github.run_number == 3
        with:
          name: public-inputs-03-${{ github.run_id }}
          path: ${{ runner.temp }}/public-parts/input-03
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && github.run_number == 3
        with:
          name: public-inputs-04-${{ github.run_id }}
          path: ${{ runner.temp }}/public-parts/input-04
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && github.run_number == 3
        with:
          name: public-inputs-05-${{ github.run_id }}
          path: ${{ runner.temp }}/public-parts/input-05
          compression-level: 0
          retention-days: 1
