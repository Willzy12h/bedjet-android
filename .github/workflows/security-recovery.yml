name: Security recovery verification
on:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    if: github.head_ref == 'gpt/nocturne-final' && github.event.pull_request.number == 4 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Apply exact security edits in throwaway checkout
        run: python3 .github/security-fix.py
      - name: Focused behavioural GREEN
        run: |
          set -o pipefail
          python3 -B .github/workflows/test_release_manifest.py
          ./gradlew --no-daemon --continue --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8' \
            :core:test --tests '*SecurityTest' :app:testDebugUnitTest --tests '*SecurityTest' 2>&1 | tee security-green.log
      - name: Package only the verified source patch
        run: |
          mkdir verified
          git diff --binary > verified/security.patch
          printf '%s\n' '${{ github.event.pull_request.head.sha }}' > verified/base.txt
          git diff --stat
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: verified-security-patch
          path: verified/
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: security-recovery-evidence-${{ github.run_id }}
          path: |
            security-green.log
            core/build/test-results/test/
            app/build/test-results/testDebugUnitTest/
          retention-days: 14
  publish:
    needs: verify
    if: github.head_ref == 'gpt/nocturne-final' && github.event.pull_request.number == 4 && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-security-patch
          path: ${{ runner.temp }}/verified
      - name: Publish validated source only, exact-head fast-forward
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(cat "$RUNNER_TEMP/verified/base.txt")" = "$EXPECTED"
          test "$(git ls-remote origin refs/heads/gpt/nocturne-final | cut -f1)" = "$EXPECTED"
          git apply --check "$RUNNER_TEMP/verified/security.patch"
          git apply --index "$RUNNER_TEMP/verified/security.patch"
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          allowed_helpers = {'.github/workflows/release_manifest.py','.github/workflows/test_release_manifest.py','.github/workflows/fixtures/release-manifest-reviewed.xml'}
          assert paths and all(p.startswith(('app/src/','core/src/')) or p in allowed_helpers for p in paths), paths
          PY
          git config user.name 'Nocturne security verifier'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(security): enforce command limits, reject malformed status and contain legacy Health Connect'
          git push origin HEAD:refs/heads/gpt/nocturne-final
          git rev-parse HEAD
