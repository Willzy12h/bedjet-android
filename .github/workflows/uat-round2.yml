name: UAT round 2 regressions
on:
  pull_request:
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
      - name: Record runner Android SDK inventory
        run: |
          python3 -B .github/workflows/android_sdk_profile.py before \
            --output "$RUNNER_TEMP/nocturne-sdk-evidence/android-sdk-before.json"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/nocturne-android-sdk
        with:
          cmdline-tools-version: "15859902"
          accept-android-sdk-licenses: false
          packages: ''
          log-accepted-android-sdk-licenses: false
      - run: |
          python3 -B .github/workflows/android_sdk_profile.py install \
            --output "$RUNNER_TEMP/nocturne-sdk-evidence/android-sdk-install.json"
      - name: Verify isolated Android SDK profile
        run: |
          python3 -B .github/workflows/android_sdk_profile.py after \
            --output "$RUNNER_TEMP/nocturne-sdk-evidence/android-sdk-profile.json"
      - name: UAT behavioural tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon --continue --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8' \
            :core:test :app:testDebugUnitTest --tests '*Uat*' --tests '*U06ControlSemanticsTest' \
            :app:lintDebug 2>&1 | tee uat-round2.log
      - name: Record behavioural assertions
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as E
          for root in (Path('core/build/test-results/test'),Path('app/build/test-results/testDebugUnitTest')):
            totals={k:0 for k in ('tests','failures','errors','skipped')}
            for f in sorted(root.glob('TEST-*.xml')):
              s=E.parse(f).getroot()
              for k in totals: totals[k]+=int(s.get(k,0))
              if 'Uat' in s.get('name',''): print(s.attrib)
              for c in s.findall('testcase'):
                for e in c.findall('failure')+c.findall('error'): print('FAILED',c.attrib,e.attrib,(e.text or '')[:2200])
            print(root,totals)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: uat-round2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/nocturne-sdk-evidence/
            uat-round2.log
            core/build/test-results/test/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          retention-days: 14
      - name: Retained U06 normal and large-text captures
        env:
          SCREENSHOT_TAG: uat2
        run: |
          set -o pipefail
          ./gradlew --no-daemon --continue --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8' \
            :app:testDebugUnitTest --tests '*U06NormalCaptureTest' --tests '*U06LargeTextCaptureTest' \
            2>&1 | tee uat-u06-captures.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: uat-u06-captures-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            uat-u06-captures.log
            app/build/test-results/testDebugUnitTest/
            app/build/screenshots/uat2/u06/
          retention-days: 14
