name: UAT round 2 regressions
on:
  pull_request:
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: UAT behavioural tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon --continue --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8' \
            :core:test :app:testDebugUnitTest --tests '*Uat*' --tests '*U06ControlSemanticsTest' \
            :app:lintDebug 2>&1 | tee uat-round2.log
      - name: Record behavioural assertions
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as E
          for root in (Path('core/build/test-results/test'),Path('app/build/test-results/testDebugUnitTest')):
            totals={k:0 for k in ('tests','failures','errors','skipped')}
            for f in sorted(root.glob('TEST-*.xml')):
              s=E.parse(f).getroot()
              for k in totals: totals[k]+=int(s.get(k,0))
              if 'Uat' in s.get('name',''): print(s.attrib)
              for c in s.findall('testcase'):
                for e in c.findall('failure')+c.findall('error'): print('FAILED',c.attrib,e.attrib,(e.text or '')[:2200])
            print(root,totals)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: uat-round2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            uat-round2.log
            core/build/test-results/test/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          retention-days: 14
      - name: Retained U06 normal and large-text captures
        env:
          SCREENSHOT_TAG: uat2
        run: |
          set -o pipefail
          ./gradlew --no-daemon --continue --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8' \
            :app:testDebugUnitTest --tests '*U06NormalCaptureTest' --tests '*U06LargeTextCaptureTest' \
            2>&1 | tee uat-u06-captures.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: uat-u06-captures-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            uat-u06-captures.log
            app/build/test-results/testDebugUnitTest/
            app/build/screenshots/uat2/u06/
          retention-days: 14
