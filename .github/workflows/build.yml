name: Build

on:
  push:
    branches: [main, gpt/nocturne-independent-fixes]
    tags: ["v*"]
  # Every pull request reports the "build" check, so it can be a required check. Docs-only changes (README, demo,
  # policy text, images) cannot affect the app: their "build" passes without the Android jobs (see prepare).
  pull_request:

permissions:
  contents: read

# Keep the version-history check and publication of different tags in one queue.
concurrency:
  group: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && 'nocturne-production-release' || format('nocturne-build-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PYTHONDONTWRITEBYTECODE: "1"

defaults:
  run:
    shell: bash

# The checks run as three jobs at the same time (gate, release-build, screenshots); "build" then confirms they all
# passed. A merge into main that releases skips all three when a pull request already passed this exact tree, and
# signs and publishes that pull request's unsigned APK (release_reuse.py).
jobs:
  # This job and the three check jobs are independent of production signing secrets.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      version-name: ${{ steps.version.outputs.name }}
      version-code: ${{ steps.version.outputs.code }}
      release: ${{ steps.version.outputs.release }}
      candidate: ${{ steps.version.outputs.candidate }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      android: ${{ steps.changes.outputs.android }}
      reuse-run-id: ${{ steps.reuse.outputs.reuse-run-id }}
      reuse-artifact-attempt: ${{ steps.reuse.outputs.reuse-artifact-attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Source provenance
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/nocturne-source" "$RUNNER_TEMP/nocturne-release/evidence"
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/nocturne-source/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/nocturne-source/commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/nocturne-source/tree.txt"
          cp "$RUNNER_TEMP/nocturne-source/"*.txt "$RUNNER_TEMP/nocturne-release/evidence/"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nocturne-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nocturne-source/
          retention-days: 14
          if-no-files-found: error

      - name: Version
        id: version
        env:
          RELEASE_VERSION_CODE: ${{ vars.NOCTURNE_RELEASE_VERSION_CODE }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE=false
          CANDIDATE=false
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]] \
            || [[ "$GITHUB_EVENT_NAME" == pull_request && "$PR_HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" ]]; then
            # A merge into main publishes release.properties' version once, if its tag doesn't exist yet.
            FILE_NAME="$(sed -n 's/^versionName=//p' release.properties)"
            FILE_CODE="$(sed -n 's/^versionCode=//p' release.properties)"
            if ! [[ "$FILE_NAME" =~ ^[0-9][A-Za-z0-9.+_-]*$ ]] || ! [[ "$FILE_CODE" =~ ^[1-9][0-9]{0,9}$ ]] || (( FILE_CODE > 2100000000 )); then
              echo "::error::release.properties needs a valid versionName and versionCode"
              exit 1
            fi
            TAGS="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$FILE_NAME" --jq '.[].ref')"
            if grep -qx "refs/tags/v$FILE_NAME" <<< "$TAGS"; then
              echo "v$FILE_NAME is already tagged; this build doesn't release it."
            elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
              RELEASE=true
            else
              # This pull request would release: build the APK main would publish, so the merge can publish this one.
              CANDIDATE=true
            fi
          fi
          if [[ "$RELEASE" == true || "$CANDIDATE" == true ]]; then
            VERSION_NAME="$FILE_NAME"
            VERSION_CODE="$FILE_CODE"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RELEASE=true
            if ! [[ "$RELEASE_VERSION_CODE" =~ ^[1-9][0-9]{0,9}$ ]] || (( RELEASE_VERSION_CODE > 2100000000 )); then
              echo "::error::Set NOCTURNE_RELEASE_VERSION_CODE to a valid explicit Android versionCode"
              exit 1
            fi
            if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9][A-Za-z0-9.+_-]*$ ]]; then
              echo "::error::Invalid release version tag"
              exit 1
            fi
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            VERSION_CODE="$RELEASE_VERSION_CODE"
          else
            VERSION_NAME="0.2.0-uat2-test.${GITHUB_RUN_NUMBER}"
            # Upgrade floor for existing permanent TEST installations; production stays explicit.
            VERSION_CODE="$((20261027 + GITHUB_RUN_NUMBER))"
          fi
          printf 'VERSION_NAME=%s\nVERSION_CODE=%s\n' "$VERSION_NAME" "$VERSION_CODE" >> "$GITHUB_ENV"
          PRERELEASE=false
          if [[ "$VERSION_NAME" == *-* ]]; then PRERELEASE=true; fi
          printf 'name=%s\ncode=%s\nrelease=%s\ncandidate=%s\nprerelease=%s\n' "$VERSION_NAME" "$VERSION_CODE" "$RELEASE" "$CANDIDATE" "$PRERELEASE" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Release helper regression tests
        run: |
          python3 -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r .github/workflows/requirements-release.txt
          python3 -B .github/workflows/test_release_artifacts.py
          python3 -B .github/workflows/test_release_reuse.py
          python3 -B .github/workflows/test_release_manifest.py
          python3 -B .github/workflows/test_release_screenshots.py
          python3 -B .github/workflows/test_permanent_test_signing.py
          python3 -B .github/workflows/release-serialization-test.py

      - name: Changed files
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          ANDROID=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename' > "$RUNNER_TEMP/changed-files.txt"
            # GitHub lists at most 3000 files; a longer list is treated as touching the app.
            if python3 -B - "$RUNNER_TEMP/changed-files.txt" <<'PY'
          import fnmatch, sys
          files = open(sys.argv[1]).read().split()
          docs = lambda name: name == "LICENSE" or name.startswith("docs/") or fnmatch.fnmatch(name, "*.md")
          sys.exit(0 if files and len(files) < 3000 and all(map(docs, files)) else 1)
          PY
            then
              ANDROID=false
              echo "Docs-only change: the Android jobs are skipped."
            fi
          fi
          echo "android=$ANDROID" >> "$GITHUB_OUTPUT"

      # "Re-run all jobs" (attempt 2 or later) always checks and builds everything here again.
      - name: Reuse the merged pull request's checks
        id: reuse
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.version.outputs.release }}
        run: |
          APK=()
          if [[ "$RELEASE" == true ]]; then APK=(--require-apk); fi
          python3 -B .github/workflows/release_reuse.py "${APK[@]}" \
            --repository "$GITHUB_REPOSITORY" --commit "$SOURCE_SHA" --tree "$(git rev-parse HEAD^{tree})" \
            --version-name "$VERSION_NAME" --version-code "$VERSION_CODE" \
            --report "$RUNNER_TEMP/nocturne-release/evidence/release-reuse.json" --github-output "$GITHUB_OUTPUT"

      - name: Preserve preparation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nocturne-prepare-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nocturne-release/evidence/
          if-no-files-found: warn
          retention-days: 30

  # Every test: core on the JVM, the app on Robolectric.
  gate:
    needs: prepare
    if: needs.prepare.outputs.android == 'true' && needs.prepare.outputs.reuse-run-id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION_NAME: ${{ needs.prepare.outputs.version-name }}
      VERSION_CODE: ${{ needs.prepare.outputs.version-code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Branches in this repository keep their own build cache between pushes; forks only read.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Record runner Android SDK inventory
        run: |
          mkdir -p "$RUNNER_TEMP/nocturne-release/evidence"
          python3 -B .github/workflows/android_sdk_profile.py before \
            --output "$RUNNER_TEMP/nocturne-release/evidence/android-sdk-before.json"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/nocturne-android-sdk
        with:
          cmdline-tools-version: "15859902"
          accept-android-sdk-licenses: false
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Android SDK packages
        run: |
          python3 -B .github/workflows/android_sdk_profile.py install \
            --output "$RUNNER_TEMP/nocturne-release/evidence/android-sdk-install.json"

      - name: Verify isolated Android SDK profile
        run: |
          python3 -B .github/workflows/android_sdk_profile.py after \
            --output "$RUNNER_TEMP/nocturne-release/evidence/android-sdk-profile.json"

      - name: Required tests
        id: gate
        run: |
          # Each app test class runs in its own JVM, three at a time (app/build.gradle.kts), so one class's leftover
          # background work cannot stall the classes after it.
          ./gradlew --no-daemon --max-workers=4 '-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8' \
            :core:test :app:testDebugUnitTest \
            -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE" \
            2>&1 | tee "$RUNNER_TEMP/nocturne-release/evidence/required-gate.log"

      - name: Record required test counts
        if: always()
        run: |
          python3 -B .github/workflows/release_artifacts.py gate-summary --part tests \
            --expected-source "$SOURCE_SHA" --output "$RUNNER_TEMP/nocturne-release/evidence/required-gate-summary.json" \
            2>&1 | tee -a "$RUNNER_TEMP/nocturne-release/evidence/required-gate.log"

      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nocturne-gate-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          path: |
            ${{ runner.temp }}/nocturne-release/evidence/
            core/build/test-results/test/
            app/build/test-results/testDebugUnitTest/
            core/build/reports/tests/test/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

  # Debug build and lint, then the shrunk release: unsigned, fail-closed signing probes and a throwaway test signature.
  release-build:
    needs: prepare
    if: needs.prepare.outputs.android == 'true' && needs.prepare.outputs.reuse-run-id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION_NAME: ${{ needs.prepare.outputs.version-name }}
      VERSION_CODE: ${{ needs.prepare.outputs.version-code }}
      # An APK that may be published is built from scratch: no build cache and no Gradle home a pull request wrote.
      PUBLISHABLE: ${{ needs.prepare.outputs.release == 'true' || needs.prepare.outputs.candidate == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: ${{ env.PUBLISHABLE == 'true' && github.event_name == 'pull_request' }}
          cache-read-only: ${{ env.PUBLISHABLE == 'true' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}

      - name: Record runner Android SDK inventory
        run: |
          mkdir -p "$RUNNER_TEMP/nocturne-release/evidence"
          python3 -B .github/workflows/android_sdk_profile.py before \
            --output "$RUNNER_TEMP/nocturne-release/evidence/android-sdk-before.json"
          if [[ "$PUBLISHABLE" == true ]]; then echo "BUILD_CACHE=--no-build-cache" >> "$GITHUB_ENV"; else echo "BUILD_CACHE=--build-cache" >> "$GITHUB_ENV"; fi

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/nocturne-android-sdk
        with:
          cmdline-tools-version: "15859902"
          accept-android-sdk-licenses: false
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Android SDK packages
        run: |
          python3 -B .github/workflows/android_sdk_profile.py install \
            --output "$RUNNER_TEMP/nocturne-release/evidence/android-sdk-install.json"

      - name: Verify isolated Android SDK profile
        run: |
          python3 -B .github/workflows/android_sdk_profile.py after \
            --output "$RUNNER_TEMP/nocturne-release/evidence/android-sdk-profile.json"

      # One Gradle daemon serves every Gradle step in this job (same JVM arguments), instead of a fresh JVM per build.
      - name: Debug build and lint
        id: lint
        run: |
          ./gradlew "$BUILD_CACHE" '-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8' --max-workers=4 \
            :app:assembleDebug :app:lintDebug \
            -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE" \
            2>&1 | tee "$RUNNER_TEMP/nocturne-release/evidence/debug-and-lint.log"

      - name: Record lint findings
        if: always()
        run: |
          python3 -B .github/workflows/release_artifacts.py gate-summary --part lint \
            --expected-source "$SOURCE_SHA" --output "$RUNNER_TEMP/nocturne-release/evidence/lint-summary.json" \
            2>&1 | tee -a "$RUNNER_TEMP/nocturne-release/evidence/debug-and-lint.log"

      - name: Unsigned, fail-closed and explicit test-signed release builds
        id: signing
        run: |
          python3 -B .github/workflows/release_signing.py \
            --sdk "$ANDROID_HOME" --build-tools 35.0.0 \
            --version-name "$VERSION_NAME" --version-code "$VERSION_CODE" \
            --expected-source "$SOURCE_SHA" --output "$RUNNER_TEMP/nocturne-release" \
            2>&1 | tee "$RUNNER_TEMP/nocturne-release/evidence/signing-driver.log"

      - name: Release serialization JVM fixture
        run: |
          ./gradlew "$BUILD_CACHE" --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8' \
            -I .github/workflows/release-serialization.init.gradle \
            :app:testReleaseUnitTest --tests io.github.willzy12h.nocturne.releasegate.ReleaseSerializationTest \
            :app:exportReleaseSerializationInputs \
            -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE" \
            2>&1 | tee "$RUNNER_TEMP/nocturne-release/evidence/release-serialization-jvm.log"

      - name: Exercise serialization on R8-shrunk JVM classes
        id: serialization_runtime
        run: |
          python3 -B .github/workflows/release_serialization_shrunk.py \
            --output "$RUNNER_TEMP/nocturne-release/evidence/serialization-shrunk" \
            2>&1 | tee "$RUNNER_TEMP/nocturne-release/evidence/serialization-shrunk-driver.log"

      - name: Inspect serializers in the actual minified APK
        id: serialization
        run: |
          python3 -B .github/workflows/release_serialization.py \
            --apk "$RUNNER_TEMP/nocturne-release/candidate/nocturne-$VERSION_NAME-TEST-ONLY.apk" \
            --mapping "$RUNNER_TEMP/nocturne-release/candidate/r8/mapping.txt" \
            --usage "$RUNNER_TEMP/nocturne-release/candidate/r8/usage.txt" \
            --junit app/build/test-results/testReleaseUnitTest/TEST-io.github.willzy12h.nocturne.releasegate.ReleaseSerializationTest.xml \
            --shrunk-report "$RUNNER_TEMP/nocturne-release/evidence/serialization-shrunk/shrunk-runtime.json" \
            --report "$RUNNER_TEMP/nocturne-release/evidence/release-serialization.json"

      - name: Release manifest inventory
        id: manifest
        run: |
          python3 -B .github/workflows/release_manifest.py \
            --manifest app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml \
            --output app/build/reports/release-manifest

      - name: Record gate outcomes
        if: always()
        env:
          LINT_GATE: ${{ steps.lint.outcome }}
          SIGNING_GATE: ${{ steps.signing.outcome }}
          SERIALIZATION_RUNTIME_GATE: ${{ steps.serialization_runtime.outcome }}
          SERIALIZATION_GATE: ${{ steps.serialization.outcome }}
          MANIFEST_GATE: ${{ steps.manifest.outcome }}
        run: |
          ./gradlew --stop >/dev/null 2>&1 || true
          python3 -B - <<'PY'
          import json, os
          from pathlib import Path
          output = Path(os.environ["RUNNER_TEMP"]) / "nocturne-release/evidence/gate-outcomes.json"
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps({"source_commit": os.environ["SOURCE_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "outcomes": {key: os.environ[key] for key in ("LINT_GATE", "SIGNING_GATE", "SERIALIZATION_RUNTIME_GATE", "SERIALIZATION_GATE", "MANIFEST_GATE")}}, indent=2) + "\n")
          PY

      - name: Preserve release evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nocturne-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/nocturne-release/evidence/
            ${{ runner.temp }}/nocturne-release/unsigned/release-metadata.json
            ${{ runner.temp }}/nocturne-release/unsigned/signature.txt
            ${{ runner.temp }}/nocturne-release/unsigned/r8/
            app/build/reports/lint-results-debug.*
            app/build/reports/release-serialization/inputs.json
            app/build/reports/release-manifest/
            app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml
            app/build/generated/manifests/generateReleaseSecurityManifest/AndroidManifest.xml
            app/build/test-results/testReleaseUnitTest/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload test-only candidate
        if: always() && steps.signing.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nocturne-TEST-ONLY-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nocturne-release/candidate/
          if-no-files-found: error
          retention-days: 30

      # The production job signs this, from this run or, for a merge, from the pull request run that passed the same tree.
      - name: Transfer unsigned production input
        if: needs.prepare.outputs.release == 'true' || needs.prepare.outputs.candidate == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nocturne-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nocturne-release/unsigned/
          if-no-files-found: error
          retention-days: 30

  # Fixed-clock screenshots of every screen, compared with the reference set (differences are reported, not fatal).
  screenshots:
    needs: prepare
    if: needs.prepare.outputs.android == 'true' && needs.prepare.outputs.reuse-run-id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION_NAME: ${{ needs.prepare.outputs.version-name }}
      VERSION_CODE: ${{ needs.prepare.outputs.version-code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/nocturne-android-sdk
        with:
          cmdline-tools-version: "15859902"
          accept-android-sdk-licenses: false
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Android SDK packages
        run: |
          mkdir -p "$RUNNER_TEMP/nocturne-release/evidence"
          python3 -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r .github/workflows/requirements-release.txt
          python3 -B .github/workflows/android_sdk_profile.py install \
            --output "$RUNNER_TEMP/nocturne-release/evidence/android-sdk-install.json"

      - name: Render fixed-clock after screens
        id: screenshots
        env:
          SCREENSHOT_TAG: after
        run: |
          # --rerun runs only the capture tests again, even when a cached result exists; nothing else is rebuilt.
          ./gradlew --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8' \
            :app:testDebugUnitTest --tests '*ScreenshotCapture*' --rerun \
            -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE" \
            2>&1 | tee "$RUNNER_TEMP/nocturne-release/evidence/screenshots.log"
          python3 -B .github/workflows/release_screenshots.py \
            --baseline docs/screenshots/baseline --after app/build/screenshots/after \
            --output app/build/reports/release-screenshots

      - name: Preserve screenshot evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nocturne-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/nocturne-release/evidence/
            app/build/reports/release-screenshots/
            app/build/screenshots/after/
            docs/screenshots/baseline/
            app/build/test-results/testDebugUnitTest/TEST-*ScreenshotCapture*.xml
          if-no-files-found: warn
          retention-days: 30

  # The one check to require: it passes only when every check job passed, the change is docs-only, or a merge reuses
  # a pull request run that passed this exact tree.
  build:
    needs: [prepare, gate, release-build, screenshots]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verified: ${{ steps.verdict.outputs.verified }}
      unsigned-run-id: ${{ steps.verdict.outputs.unsigned-run-id }}
      unsigned-attempt: ${{ steps.verdict.outputs.unsigned-attempt }}
    steps:
      - name: Verdict
        id: verdict
        env:
          PREPARE: ${{ needs.prepare.result }}
          GATE: ${{ needs.gate.result }}
          RELEASE_BUILD: ${{ needs.release-build.result }}
          SCREENSHOTS: ${{ needs.screenshots.result }}
          ANDROID: ${{ needs.prepare.outputs.android }}
          REUSE_RUN_ID: ${{ needs.prepare.outputs.reuse-run-id }}
          REUSE_ATTEMPT: ${{ needs.prepare.outputs.reuse-artifact-attempt }}
        run: |
          echo "prepare=$PREPARE gate=$GATE release-build=$RELEASE_BUILD screenshots=$SCREENSHOTS android=$ANDROID reuse=${REUSE_RUN_ID:-none}"
          test "$PREPARE" = success
          if [[ "$ANDROID" != true ]]; then
            [[ "$GATE/$RELEASE_BUILD/$SCREENSHOTS" == skipped/skipped/skipped ]]
            echo "Docs-only change: no Android checks needed." | tee -a "$GITHUB_STEP_SUMMARY"
          elif [[ -n "$REUSE_RUN_ID" ]]; then
            [[ "$GATE/$RELEASE_BUILD/$SCREENSHOTS" == skipped/skipped/skipped ]]
            echo "Pull request run $REUSE_RUN_ID passed every check on this exact tree, so they are not repeated." | tee -a "$GITHUB_STEP_SUMMARY"
            printf 'unsigned-run-id=%s\nunsigned-attempt=%s\n' "$REUSE_RUN_ID" "$REUSE_ATTEMPT" >> "$GITHUB_OUTPUT"
          else
            [[ "$GATE/$RELEASE_BUILD/$SCREENSHOTS" == success/success/success ]]
            printf 'unsigned-run-id=%s\nunsigned-attempt=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          fi
          echo "verified=true" >> "$GITHUB_OUTPUT"

  # Production credentials are never present in the check jobs or in PR runs.
  production:
    needs: [prepare, build]
    environment: production
    # !cancelled(): the check jobs this depends on through "build" are skipped when a pull request's APK is reused.
    if: ${{ !cancelled() && github.event_name == 'push' && needs.prepare.outputs.release == 'true' && needs.build.result == 'success' && needs.build.outputs.verified == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      VERSION_NAME: ${{ needs.prepare.outputs.version-name }}
      VERSION_CODE: ${{ needs.prepare.outputs.version-code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          log-accepted-android-sdk-licenses: false

      - run: sdkmanager "build-tools;35.0.0"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nocturne-unsigned-${{ needs.build.outputs.unsigned-run-id }}-${{ needs.build.outputs.unsigned-attempt }}
          run-id: ${{ needs.build.outputs.unsigned-run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/nocturne-unsigned

      - name: Check expected signer and all published version codes
        id: history
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CERT_SHA256: ${{ vars.NOCTURNE_RELEASE_CERT_SHA256 }}
        run: |
          python3 -B - <<'PY'
          import os, sys
          sys.path.insert(0, ".github/workflows")
          from release_artifacts import fingerprint
          fingerprint(os.environ["EXPECTED_CERT_SHA256"])
          PY
          python3 -B .github/workflows/release_artifacts.py history \
            --repository "$GITHUB_REPOSITORY" --aapt2 "$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            --version-code "$VERSION_CODE" --expected-source "$SOURCE_SHA" \
            --output "$RUNNER_TEMP/nocturne-production-evidence/version-history.json"

      - name: Verify transferred unsigned artifact
        id: unsigned_input
        env:
          UNSIGNED_RUN_ID: ${{ needs.build.outputs.unsigned-run-id }}
        run: |
          # The APK was built from this exact source tree: in this run, or in the pull request run that was merged.
          SOURCE_TREE="$(git rev-parse HEAD^{tree})" python3 -B - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, ".github/workflows")
          from release_artifacts import sha256
          root = Path(os.environ["RUNNER_TEMP"]) / "nocturne-unsigned"
          metadata = json.loads((root / "release-metadata.json").read_text())
          same_run = os.environ["UNSIGNED_RUN_ID"] == os.environ["GITHUB_RUN_ID"]
          if (metadata["source_tree"] != os.environ["SOURCE_TREE"]
              or (same_run and metadata["source_commit"] != os.environ["SOURCE_SHA"])
              or metadata["signing_identity"] != "unsigned"
              or metadata["signer_sha256"] is not None or metadata["apk_sha256"] != sha256(root / "app-release-unsigned.apk")):
              raise SystemExit("Unsigned artifact does not match its recorded source, identity or SHA-256")
          print(f"Unsigned APK built from tree {metadata['source_tree']} (commit {metadata['source_commit']}, run {os.environ['UNSIGNED_RUN_ID']})")
          PY
          python3 -B .github/workflows/release_artifacts.py metadata \
            --apk "$RUNNER_TEMP/nocturne-unsigned/app-release-unsigned.apk" \
            --tools "$ANDROID_HOME/build-tools/35.0.0" --identity unsigned \
            --expected-source "$SOURCE_SHA" --version-code "$VERSION_CODE" --version-name "$VERSION_NAME" \
            --output "$RUNNER_TEMP/nocturne-production-evidence/unsigned-metadata.json"

      - name: Sign verified production input
        id: production_signing
        env:
          KEYSTORE_BASE64: ${{ secrets.NOCTURNE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NOCTURNE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NOCTURNE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NOCTURNE_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.NOCTURNE_RELEASE_CERT_SHA256 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release signing secrets are incomplete"
            exit 1
          fi
          umask 077
          KEYSTORE="$RUNNER_TEMP/nocturne-production-key.p12"
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          mkdir -p "$RUNNER_TEMP/nocturne-production"
          OUTPUT="$RUNNER_TEMP/nocturne-production/nocturne-$VERSION_NAME.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --v4-signing-enabled false \
            --out "$OUTPUT" "$RUNNER_TEMP/nocturne-unsigned/app-release-unsigned.apk"
          python3 -B .github/workflows/release_artifacts.py metadata \
            --apk "$OUTPUT" --tools "$ANDROID_HOME/build-tools/35.0.0" --identity production \
            --expected-certificate "$EXPECTED_CERT_SHA256" --expected-source "$SOURCE_SHA" \
            --version-code "$VERSION_CODE" --version-name "$VERSION_NAME" \
            --output "$RUNNER_TEMP/nocturne-production/release-metadata.json"

      - name: Record production gate outcomes
        if: always()
        env:
          HISTORY_GATE: ${{ steps.history.outcome }}
          UNSIGNED_INPUT_GATE: ${{ steps.unsigned_input.outcome }}
          PRODUCTION_SIGNING_GATE: ${{ steps.production_signing.outcome }}
          UNSIGNED_RUN_ID: ${{ needs.build.outputs.unsigned-run-id }}
        run: |
          python3 -B - <<'PY'
          import json, os
          from pathlib import Path
          output = Path(os.environ["RUNNER_TEMP"]) / "nocturne-production-evidence/gate-outcomes.json"
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps({"source_commit": os.environ["SOURCE_SHA"], "unsigned_run_id": os.environ["UNSIGNED_RUN_ID"],
              "outcomes": {key: os.environ[key] for key in ("HISTORY_GATE", "UNSIGNED_INPUT_GATE", "PRODUCTION_SIGNING_GATE")}}, indent=2) + "\n")
          PY

      - name: Preserve production verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nocturne-production-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/nocturne-production-evidence/
            ${{ runner.temp }}/nocturne-production/signature.txt
            ${{ runner.temp }}/nocturne-production/release-metadata.json
          if-no-files-found: warn
          retention-days: 30

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nocturne-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nocturne-production/
          if-no-files-found: error
          retention-days: 30

  # Only this job can write to the repository; it can download only the production package.
  release:
    needs: [prepare, production]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.prepare.outputs.release == 'true' && needs.production.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION_NAME: ${{ needs.prepare.outputs.version-name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          sparse-checkout: docs/releases

      - name: Release notes
        id: notes
        run: |
          NOTES="docs/releases/$VERSION_NAME.md"
          if [ -f "$NOTES" ]; then echo "file=$NOTES" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nocturne-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ needs.prepare.outputs.version-name }}
          target_commitish: ${{ env.SOURCE_SHA }}
          name: Nocturne ${{ needs.prepare.outputs.version-name }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          body_path: ${{ steps.notes.outputs.file }}
          files: |
            dist/nocturne-*.apk
            dist/release-metadata.json
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: ${{ steps.notes.outputs.file == '' }}
