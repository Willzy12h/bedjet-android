name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Release signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.NOCTURNE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NOCTURNE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NOCTURNE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NOCTURNE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release signing secrets are incomplete"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"
          echo "NOCTURNE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Version
        env:
          RELEASE_VERSION_CODE: ${{ vars.NOCTURNE_RELEASE_VERSION_CODE }}
          PREVIOUS_VERSION_CODE: ${{ vars.NOCTURNE_PREVIOUS_VERSION_CODE }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if ! [[ "$RELEASE_VERSION_CODE" =~ ^[1-9][0-9]*$ && "$PREVIOUS_VERSION_CODE" =~ ^[0-9]+$ ]] || (( RELEASE_VERSION_CODE <= PREVIOUS_VERSION_CODE )); then
              echo "::error::Set an explicit release version code greater than the previous published code"
              exit 1
            fi
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "VERSION_CODE=$RELEASE_VERSION_CODE" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
            echo "VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi

      - name: Test and build
        env:
          NOCTURNE_KEYSTORE_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.NOCTURNE_KEYSTORE_PASSWORD || '' }}
          NOCTURNE_KEY_ALIAS: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.NOCTURNE_KEY_ALIAS || '' }}
          NOCTURNE_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.NOCTURNE_KEY_PASSWORD || '' }}
        run: >
          ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
          -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"

      - name: Name the APK
        env:
          EXPECTED_CERT_SHA256: ${{ vars.NOCTURNE_RELEASE_CERT_SHA256 }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            APK=app/build/outputs/apk/release/app-release.apk
            if [ -z "$EXPECTED_CERT_SHA256" ]; then
              echo "::error::The expected release certificate fingerprint is missing"
              exit 1
            fi
            CERT_OUTPUT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK")
            ACTUAL_CERT_SHA256=$(printf '%s\n' "$CERT_OUTPUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
            if [ "${ACTUAL_CERT_SHA256,,}" != "${EXPECTED_CERT_SHA256,,}" ]; then
              echo "::error::The APK certificate does not match the expected release signer"
              exit 1
            fi
            cp "$APK" "nocturne-$VERSION_NAME.apk"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "nocturne-$VERSION_NAME-unsigned.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nocturne-${{ env.VERSION_NAME }}
          path: nocturne-*.apk

  # Only this job can write to the repository, and only for version tags, so pull-request runs never get write access.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nocturne-*
          merge-multiple: true
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/nocturne-*.apk
          generate_release_notes: true
