name: Build

on:
  push:
    # A reviewed candidate can use the existing permanent TEST identity without a PR or merge.
    branches: [main, gpt/nocturne-independent-fixes]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# Keep the version-history check and publication of different tags in one queue.
concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/v') && 'nocturne-production-release' || format('nocturne-build-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PYTHONDONTWRITEBYTECODE: "1"

defaults:
  run:
    shell: bash

jobs:
  # This entire job is independent of production signing secrets.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version-name: ${{ steps.version.outputs.name }}
      version-code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Source provenance
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/nocturne-source" "$RUNNER_TEMP/nocturne-release/evidence"
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/nocturne-source/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/nocturne-source/commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/nocturne-source/tree.txt"
          cp "$RUNNER_TEMP/nocturne-source/"*.txt "$RUNNER_TEMP/nocturne-release/evidence/"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nocturne-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nocturne-source/
          retention-days: 14
          if-no-files-found: error

      - name: Version
        id: version
        env:
          RELEASE_VERSION_CODE: ${{ vars.NOCTURNE_RELEASE_VERSION_CODE }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if ! [[ "$RELEASE_VERSION_CODE" =~ ^[1-9][0-9]{0,9}$ ]] || (( RELEASE_VERSION_CODE > 2100000000 )); then
              echo "::error::Set NOCTURNE_RELEASE_VERSION_CODE to a valid explicit Android versionCode"
              exit 1
            fi
            if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9][A-Za-z0-9.+_-]*$ ]]; then
              echo "::error::Invalid release version tag"
              exit 1
            fi
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            VERSION_CODE="$RELEASE_VERSION_CODE"
          else
            VERSION_NAME="0.2.0-uat2-test.${GITHUB_RUN_NUMBER}"
            # Upgrade floor for existing permanent TEST installations; production stays explicit.
            VERSION_CODE="$((20261027 + GITHUB_RUN_NUMBER))"
          fi
          printf 'VERSION_NAME=%s\nVERSION_CODE=%s\n' "$VERSION_NAME" "$VERSION_CODE" >> "$GITHUB_ENV"
          printf 'name=%s\ncode=%s\n' "$VERSION_NAME" "$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          log-accepted-android-sdk-licenses: false

      - name: Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Release helper regression tests
        run: |
          python3 -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r .github/workflows/requirements-release.txt
          python3 -B .github/workflows/test_release_artifacts.py
          python3 -B .github/workflows/test_release_manifest.py
          python3 -B .github/workflows/test_release_screenshots.py
          python3 -B .github/workflows/test_permanent_test_signing.py
          python3 -B .github/workflows/release-serialization-test.py

      - name: Required test, debug and lint gate
        id: gate
        run: |
          ./gradlew --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8' \
            :core:test :app:testDebugUnitTest :app:assembleDebug :app:lintDebug \
            -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE" \
            2>&1 | tee "$RUNNER_TEMP/nocturne-release/evidence/required-gate.log"

      - name: Record required gate counts before screenshot capture
        if: always()
        run: |
          python3 -B .github/workflows/release_artifacts.py gate-summary \
            --expected-source "$SOURCE_SHA" --output "$RUNNER_TEMP/nocturne-release/evidence/required-gate-summary.json" \
            2>&1 | tee -a "$RUNNER_TEMP/nocturne-release/evidence/required-gate.log"

      # Capture the full suite before the optional screenshot task replaces its XML.
      - name: Preserve full-gate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nocturne-gate-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          path: |
            ${{ runner.temp }}/nocturne-release/evidence/
            core/build/test-results/test/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
            core/build/reports/tests/test/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

      - name: Unsigned, fail-closed and explicit test-signed release builds
        id: signing
        run: |
          python3 -B .github/workflows/release_signing.py \
            --sdk "$ANDROID_HOME" --build-tools 35.0.0 \
            --version-name "$VERSION_NAME" --version-code "$VERSION_CODE" \
            --expected-source "$SOURCE_SHA" --output "$RUNNER_TEMP/nocturne-release" \
            2>&1 | tee "$RUNNER_TEMP/nocturne-release/evidence/signing-driver.log"

      # Independent TEST-only identity; does not touch the production signing settings.
      - name: Optional permanent TEST signing (when four secrets exist)
        id: permanent_test_signing
        env:
          NOCTURNE_TEST_KEYSTORE_B64: ${{ secrets.NOCTURNE_TEST_KEYSTORE_B64 }}
          NOCTURNE_TEST_KEYSTORE_PASSWORD: ${{ secrets.NOCTURNE_TEST_KEYSTORE_PASSWORD }}
          NOCTURNE_TEST_KEY_ALIAS: ${{ secrets.NOCTURNE_TEST_KEY_ALIAS }}
          NOCTURNE_TEST_KEY_PASSWORD: ${{ secrets.NOCTURNE_TEST_KEY_PASSWORD }}
        run: |
          python3 -B .github/workflows/permanent_test_signing.py \
            --unsigned "$RUNNER_TEMP/nocturne-release/unsigned/app-release-unsigned.apk" \
            --sdk "$ANDROID_HOME" --build-tools 35.0.0 \
            --version-code "$VERSION_CODE" \
            --output-dir "$RUNNER_TEMP/nocturne-permanent-test"

      - name: Upload verified permanent TEST APK
        if: ${{ steps.permanent_test_signing.outputs.signed == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nocturne-PERMANENT-TEST-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nocturne-permanent-test/
          if-no-files-found: error
          retention-days: 30
      - name: Release serialization JVM fixture
        run: |
          ./gradlew --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8' \
            -I .github/workflows/release-serialization.init.gradle \
            :app:testReleaseUnitTest --tests io.github.willzy12h.nocturne.releasegate.ReleaseSerializationTest \
            :app:exportReleaseSerializationInputs \
            -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE" \
            2>&1 | tee "$RUNNER_TEMP/nocturne-release/evidence/release-serialization-jvm.log"

      - name: Exercise serialization on R8-shrunk JVM classes
        id: serialization_runtime
        run: |
          python3 -B .github/workflows/release_serialization_shrunk.py \
            --output "$RUNNER_TEMP/nocturne-release/evidence/serialization-shrunk" \
            2>&1 | tee "$RUNNER_TEMP/nocturne-release/evidence/serialization-shrunk-driver.log"

      - name: Inspect serializers in the actual minified APK
        id: serialization
        run: |
          python3 -B .github/workflows/release_serialization.py \
            --apk "$RUNNER_TEMP/nocturne-release/candidate/nocturne-$VERSION_NAME-TEST-ONLY.apk" \
            --mapping "$RUNNER_TEMP/nocturne-release/candidate/r8/mapping.txt" \
            --usage "$RUNNER_TEMP/nocturne-release/candidate/r8/usage.txt" \
            --junit app/build/test-results/testReleaseUnitTest/TEST-io.github.willzy12h.nocturne.releasegate.ReleaseSerializationTest.xml \
            --shrunk-report "$RUNNER_TEMP/nocturne-release/evidence/serialization-shrunk/shrunk-runtime.json" \
            --report "$RUNNER_TEMP/nocturne-release/evidence/release-serialization.json"

      - name: Release manifest inventory
        id: manifest
        run: |
          python3 -B .github/workflows/release_manifest.py \
            --manifest app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml \
            --output app/build/reports/release-manifest

      - name: Render fixed-clock after screens
        id: screenshots
        env:
          SCREENSHOT_TAG: after
        run: |
          ./gradlew --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8' \
            :app:testDebugUnitTest --tests '*ScreenshotCapture*' --rerun-tasks \
            -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE" \
            2>&1 | tee "$RUNNER_TEMP/nocturne-release/evidence/screenshots.log"
          python3 -B .github/workflows/release_screenshots.py \
            --baseline docs/screenshots/baseline --after app/build/screenshots/after \
            --output app/build/reports/release-screenshots

      - name: Record gate outcomes
        if: always()
        env:
          REQUIRED_GATE: ${{ steps.gate.outcome }}
          SIGNING_GATE: ${{ steps.signing.outcome }}
          SERIALIZATION_RUNTIME_GATE: ${{ steps.serialization_runtime.outcome }}
          SERIALIZATION_GATE: ${{ steps.serialization.outcome }}
          MANIFEST_GATE: ${{ steps.manifest.outcome }}
          SCREENSHOT_GATE: ${{ steps.screenshots.outcome }}
        run: |
          python3 -B - <<'PY'
          import json, os
          from pathlib import Path
          output = Path(os.environ["RUNNER_TEMP"]) / "nocturne-release/evidence/gate-outcomes.json"
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps({"source_commit": os.environ["SOURCE_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "outcomes": {key: os.environ[key] for key in ("REQUIRED_GATE", "SIGNING_GATE", "SERIALIZATION_RUNTIME_GATE", "SERIALIZATION_GATE", "MANIFEST_GATE", "SCREENSHOT_GATE")}}, indent=2) + "\n")
          PY

      - name: Preserve release and screenshot evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nocturne-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/nocturne-release/evidence/
            ${{ runner.temp }}/nocturne-release/unsigned/release-metadata.json
            ${{ runner.temp }}/nocturne-release/unsigned/signature.txt
            ${{ runner.temp }}/nocturne-release/unsigned/r8/
            app/build/reports/release-serialization/inputs.json
            app/build/reports/release-manifest/
            app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml
            app/build/generated/manifests/generateReleaseSecurityManifest/AndroidManifest.xml
            app/build/reports/release-screenshots/
            app/build/screenshots/after/
            docs/screenshots/baseline/
            app/build/test-results/testReleaseUnitTest/
            app/build/test-results/testDebugUnitTest/TEST-*ScreenshotCapture*.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Upload test-only candidate
        if: always() && steps.signing.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nocturne-TEST-ONLY-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nocturne-release/candidate/
          if-no-files-found: error
          retention-days: 30

      - name: Transfer unsigned production input
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nocturne-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nocturne-release/unsigned/
          if-no-files-found: error
          retention-days: 7

  # Production credentials are never present in the test/build job or in PR runs.
  production:
    needs: build
    environment: production
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION_NAME: ${{ needs.build.outputs.version-name }}
      VERSION_CODE: ${{ needs.build.outputs.version-code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          log-accepted-android-sdk-licenses: false

      - run: sdkmanager "build-tools;35.0.0"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nocturne-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nocturne-unsigned

      - name: Check expected signer and all published version codes
        id: history
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CERT_SHA256: ${{ vars.NOCTURNE_RELEASE_CERT_SHA256 }}
        run: |
          python3 -B - <<'PY'
          import os, sys
          sys.path.insert(0, ".github/workflows")
          from release_artifacts import fingerprint
          fingerprint(os.environ["EXPECTED_CERT_SHA256"])
          PY
          python3 -B .github/workflows/release_artifacts.py history \
            --repository "$GITHUB_REPOSITORY" --aapt2 "$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            --version-code "$VERSION_CODE" --expected-source "$SOURCE_SHA" \
            --output "$RUNNER_TEMP/nocturne-production-evidence/version-history.json"

      - name: Verify transferred unsigned artifact
        id: unsigned_input
        run: |
          python3 -B - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, ".github/workflows")
          from release_artifacts import sha256
          root = Path(os.environ["RUNNER_TEMP"]) / "nocturne-unsigned"
          metadata = json.loads((root / "release-metadata.json").read_text())
          if (metadata["source_commit"] != os.environ["SOURCE_SHA"] or metadata["signing_identity"] != "unsigned"
              or metadata["signer_sha256"] is not None or metadata["apk_sha256"] != sha256(root / "app-release-unsigned.apk")):
              raise SystemExit("Unsigned artifact does not match its recorded source, identity or SHA-256")
          PY
          python3 -B .github/workflows/release_artifacts.py metadata \
            --apk "$RUNNER_TEMP/nocturne-unsigned/app-release-unsigned.apk" \
            --tools "$ANDROID_HOME/build-tools/35.0.0" --identity unsigned \
            --expected-source "$SOURCE_SHA" --version-code "$VERSION_CODE" --version-name "$VERSION_NAME" \
            --output "$RUNNER_TEMP/nocturne-production-evidence/unsigned-metadata.json"

      - name: Sign verified production input
        id: production_signing
        env:
          KEYSTORE_BASE64: ${{ secrets.NOCTURNE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NOCTURNE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NOCTURNE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NOCTURNE_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.NOCTURNE_RELEASE_CERT_SHA256 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release signing secrets are incomplete"
            exit 1
          fi
          umask 077
          KEYSTORE="$RUNNER_TEMP/nocturne-production-key.p12"
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          mkdir -p "$RUNNER_TEMP/nocturne-production"
          OUTPUT="$RUNNER_TEMP/nocturne-production/nocturne-$VERSION_NAME.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --v4-signing-enabled false \
            --out "$OUTPUT" "$RUNNER_TEMP/nocturne-unsigned/app-release-unsigned.apk"
          python3 -B .github/workflows/release_artifacts.py metadata \
            --apk "$OUTPUT" --tools "$ANDROID_HOME/build-tools/35.0.0" --identity production \
            --expected-certificate "$EXPECTED_CERT_SHA256" --expected-source "$SOURCE_SHA" \
            --version-code "$VERSION_CODE" --version-name "$VERSION_NAME" \
            --output "$RUNNER_TEMP/nocturne-production/release-metadata.json"

      - name: Record production gate outcomes
        if: always()
        env:
          HISTORY_GATE: ${{ steps.history.outcome }}
          UNSIGNED_INPUT_GATE: ${{ steps.unsigned_input.outcome }}
          PRODUCTION_SIGNING_GATE: ${{ steps.production_signing.outcome }}
        run: |
          python3 -B - <<'PY'
          import json, os
          from pathlib import Path
          output = Path(os.environ["RUNNER_TEMP"]) / "nocturne-production-evidence/gate-outcomes.json"
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps({"source_commit": os.environ["SOURCE_SHA"],
              "outcomes": {key: os.environ[key] for key in ("HISTORY_GATE", "UNSIGNED_INPUT_GATE", "PRODUCTION_SIGNING_GATE")}}, indent=2) + "\n")
          PY

      - name: Preserve production verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nocturne-production-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/nocturne-production-evidence/
            ${{ runner.temp }}/nocturne-production/signature.txt
            ${{ runner.temp }}/nocturne-production/release-metadata.json
          if-no-files-found: warn
          retention-days: 30

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nocturne-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nocturne-production/
          if-no-files-found: error
          retention-days: 30

  # Only this job can write to the repository; it can download only the production package.
  release:
    needs: production
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nocturne-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/nocturne-*.apk
            dist/release-metadata.json
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
