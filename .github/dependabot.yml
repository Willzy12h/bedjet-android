# Proposes library updates as pull requests, once a month, grouped so they arrive as a few reviewable PRs.
# Nothing merges by itself: each PR runs the full build and tests like any other change.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      androidx-and-compose:
        patterns: ["androidx.*", "com.android.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "org.jetbrains.kotlinx*"]
      testing:
        patterns: ["org.junit*", "junit:*", "org.robolectric*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /.github/workflows
    schedule:
      interval: monthly
    groups:
      release-tools:
        patterns: ["*"]
